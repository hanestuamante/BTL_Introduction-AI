[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-puzzle-search"
version = "1.0.0"
description = "DFS and Greedy Best-First Search visualizer for Pipes and Futoshiki"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
logic-search = "logic_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "src/logic_search/app.py",
  "src/logic_search/cli.py",
  "src/logic_search/io.py",
  "src/logic_search/ui/*",
  "src/logic_search/benchmark/*",
  "src/logic_search/puzzles/*/generator.py",
  "src/logic_search/puzzles/*/heuristic.py",
  "src/logic_search/puzzles/*/model.py",
  "src/logic_search/puzzles/*/parser.py",
]
